[project]
name = "teachers-assistant-local-agent"
version = "0.1.0"
description = "A local teacher's assistant agent demo powered by Ollama, Gradio, and MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.7",
    "mcp>=2.0.0",
    "gradio>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
]

[tool.uv]
# This repository is a collection of runnable scripts, not an installable
# Python package. UV should manage the environment and dependencies only.
package = false
