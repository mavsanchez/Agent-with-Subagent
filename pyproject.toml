[project]
name = "teachers-assistant-local-agent"
version = "0.1.0"
description = "A teacher's assistant agent demo powered by LiteLLM, Gradio, and MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "mcp>=2.0.0",
    "gradio>=6.0",
    "matplotlib>=3.8",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[tool.uv]
# UV manages dependencies only. The two root entry-point scripts import the
# local teacher_assistant package directly; the project is not installed.
package = false
